# LPIC-1 Practice Environment
# Run all distros: docker compose up -d
# Enter a container: docker compose exec <distro> bash

services:
  debian:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: ${USERNAME:-student}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        DOTFILES_REPO: ${DOTFILES_REPO:-https://github.com/lpoblet/dotfiles}
    container_name: lpic1-debian
    hostname: debian-practice
    privileged: true  # Needed for systemd, disk management, and networking practice
    stdin_open: true
    tty: true
    volumes:
      - debian-home:/home/student
      - ${SCRIPTS_PATH:-../}:/home/student/scripts:ro
    environment:
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
    command: ["sleep", "infinity"]
    networks:
      - lpic1-network
    ports:
      - "${SSH_PORT_DEBIAN:-2222}:22"
    restart: "no"

  ubuntu:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
      args:
        USERNAME: ${USERNAME:-student}
        USER_UID: 1001
        USER_GID: 1001
