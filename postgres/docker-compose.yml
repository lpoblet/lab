services:
  postgres:
    image: postgres:16
    container_name: postgres-practice
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - /mnt/backups/data:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'
